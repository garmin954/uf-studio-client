name: Publish to Aliyun OSS

# 两种用法：
# 1) 被 main.yml 的 publish-oss job 通过
#      uses: ./.github/workflows/publish-oss.yml
#    调用：使用该次构建上传的 artifacts（正常发布路径）。
# 2) 手动触发（workflow_dispatch）：从「已经发布好的 GitHub Release」下载资产再补传 OSS。
#    用于构建成功但 OSS 上传失败/被跳过的场景，不需要重新打包。
#
# 职责：
# 1) 汇总各平台安装包与 updater 清单；
# 2) 合并生成包含全部平台的 latest.json；
# 3) 上传安装包 + latest.json 到阿里云 OSS。
#
# 需要的 Secrets（Settings > Secrets and variables > Actions）：
#   OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET
#   OSS_ENDPOINT（如 oss-cn-shenzhen.aliyuncs.com，不带 https://）/ OSS_BUCKET
# 可选仓库变量：
#   OSS_PUBLIC_BASE_URL（默认 https://update.ufactory.cc）
#   OSS_ACL（需要对象公共读时设为 public-read）
#   OSS_PREFIX（默认 releases/studio_client）

on:
  workflow_call:
    inputs:
      version:
        description: "版本号（不带 v）"
        required: true
        type: string
      latest_notes:
        description: "写入 latest.json 的 notes（JSON 字符串）"
        required: true
        type: string
      prerelease:
        description: "是否预发布，预发布只写 latest-pre.json"
        required: false
        type: string
        default: "false"
    secrets:
      OSS_ACCESS_KEY_ID:
        required: false
      OSS_ACCESS_KEY_SECRET:
        required: false
      OSS_ENDPOINT:
        required: false
      OSS_BUCKET:
        required: false

  workflow_dispatch:
    inputs:
      version:
        description: "已发布 Release 的版本号（不带 v），例如 1.0.13"
        required: true
        type: string
      prerelease:
        description: "是否预发布（只写 latest-pre.json）"
        required: false
        type: string
        default: "false"

permissions:
  contents: read

# 同一版本串行发布，避免并发 run 互相覆盖 latest.json
concurrency:
  group: oss-publish-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  publish:
    name: Upload installers to OSS
    runs-on: ubuntu-22.04
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ACL: ${{ vars.OSS_ACL }}
      # 自定义域名做 endpoint 时无法推导 region，可在 Variables 里显式指定
      OSS_REGION: ${{ vars.OSS_REGION }}
      # OSS 对象前缀（与客户端更新地址中的路径一致）
      OSS_PREFIX: ${{ vars.OSS_PREFIX || 'releases/studio_client' }}
      # 对外访问域名
      OSS_PUBLIC_BASE_URL: ${{ vars.OSS_PUBLIC_BASE_URL || 'https://update.ufactory.cc' }}
      VERSION: ${{ inputs.version }}
      IS_PRERELEASE: ${{ inputs.prerelease }}
      # workflow_call 由 main.yml 传入；workflow_dispatch 时为空，回退到 Release 里的 latest.json
      LATEST_NOTES: ${{ inputs.latest_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate OSS configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${OSS_ACCESS_KEY_ID}" ]] && missing+=("OSS_ACCESS_KEY_ID")
          [[ -z "${OSS_ACCESS_KEY_SECRET}" ]] && missing+=("OSS_ACCESS_KEY_SECRET")
          [[ -z "${OSS_ENDPOINT}" ]] && missing+=("OSS_ENDPOINT")
          [[ -z "${OSS_BUCKET}" ]] && missing+=("OSS_BUCKET")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::缺少仓库 Secrets: ${missing[*]}"
            echo "请在 Settings > Secrets and variables > Actions 中添加："
            echo "  OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET"
            echo "  OSS_ENDPOINT（如 oss-cn-shenzhen.aliyuncs.com）/ OSS_BUCKET"
            exit 1
          fi

      # ---------- 正常发布路径：用本次构建的 artifacts ----------
      - name: Download bundle artifacts
        if: github.event_name == 'workflow_call'
        uses: actions/download-artifact@v4
        with:
          pattern: ufactory-studio-*
          path: downloads
          merge-multiple: true

      - name: Download updater manifests
        if: github.event_name == 'workflow_call'
        uses: actions/download-artifact@v4
        with:
          pattern: updater-manifest-*
          path: updater-manifests
          merge-multiple: true

      # ---------- 手动补传路径：从已发布的 Release 取资产 ----------
      - name: Download release assets
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir downloads
          echo "--- downloaded assets ---"
          ls -l downloads

      # 从 Release 资产重建各平台的 updater 清单片段。
      # collect 会按平台后缀族挑选（windows: -setup.exe/msi，linux: .AppImage[.tar.gz]，
      # darwin: .app.tar.gz），因此同一个扁平目录可以逐个平台解析。
      - name: Rebuild updater manifests
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p updater-manifests
          node scripts/latest-json.mjs collect \
            --bundle downloads --platform windows-x86_64 --out updater-manifests/updater-manifest-windows.json
          node scripts/latest-json.mjs collect \
            --bundle downloads --platform linux-x86_64 --out updater-manifests/updater-manifest-linux.json
          node scripts/latest-json.mjs collect \
            --bundle downloads --platform darwin-aarch64 --out updater-manifests/updater-manifest-macos.json

      - name: Resolve latest notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${LATEST_NOTES:-}" ]]; then
            echo "使用调用方传入的 notes"
            exit 0
          fi
          # 手动补传时复用 Release 里已有的 latest.json 的 notes，保证与已发布内容一致
          if [[ ! -f downloads/latest.json ]]; then
            echo "::error::downloads/latest.json 不存在，无法取得更新说明"
            exit 1
          fi
          NOTES="$(node -e "process.stdout.write(JSON.stringify(JSON.parse(require('fs').readFileSync('downloads/latest.json','utf8')).notes))")"
          {
            echo "LATEST_NOTES<<__NOTES_EOF__"
            echo "$NOTES"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Stage installers
        shell: bash
        run: |
          set -euo pipefail
          STAGE="oss-stage/v${VERSION}"
          mkdir -p "$STAGE"
          # 收集安装包本体 + 签名；macOS/Linux 的 updater 归档名大小写不一，统一用 -iname
          find downloads -type f \( \
              -iname '*.msi' -o \
              -iname '*-setup.exe' -o \
              -iname '*.dmg' -o \
              -iname '*.deb' -o \
              -iname '*.rpm' -o \
              -iname '*.appimage' -o \
              -iname '*.appimage.tar.gz' -o \
              -iname '*.app.tar.gz' -o \
              -iname '*.msi.sig' -o \
              -iname '*-setup.exe.sig' -o \
              -iname '*.appimage.sig' -o \
              -iname '*.appimage.tar.gz.sig' -o \
              -iname '*.app.tar.gz.sig' \
            \) -exec cp -v {} "$STAGE/" \;
          echo "--- staged files ---"
          ls -l "$STAGE"

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/latest-json.mjs assemble \
            --manifests updater-manifests \
            --version "${VERSION}" \
            --base-url "${OSS_PUBLIC_BASE_URL}/${OSS_PREFIX}/v${VERSION}" \
            --out oss-stage/latest.json

      - name: Install OSS uploader
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix .oss-tools --no-package-lock --no-save --no-audit --no-fund "ali-oss@6"

      - name: Upload to OSS
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-oss.mjs
